<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="assets/style.css" />
    <title>Puzzle Shop - Details</title>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand d-flex align-items-center" href="home.html"
            ><i class="bi bi-puzzle fs-3 me-1"></i>
            <p class="m-0">PuzzleShop</p></a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="home.html"
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="backoffice.html">Backoffice</a>
              </li>
            </ul>
            <div>
              <button
                class="btn btn-primary"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasRight"
                aria-controls="offcanvasRight"
              >
                <i class="bi bi-cart2 fs-4"></i>
                <span
                  class="position-absolute top-0 end-0 badge rounded-pill bg-danger m-1 d-none"
                  style="font-size: 12px"
                  id="n-cart"
                >
                </span>
              </button>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main class="flex-grow-1 d-flex flex-column justify-content-center">
      <div class="container">
        <div class="row justify-content-center align-items-center">
          <h1 class="mt-5 mb-4 text-center">Dettagli prodotto</h1>
          <div
            class="col col-12 col-md-10 col-lg-8 col-xl-6 mb-5 shadow-lg px-sm-0 rounded-2"
            id="col-details"
          ></div>
        </div>
      </div>
    </main>

    <footer class="text-center bg-dark text-light">
      <p class="py-5 m-0">&copy PuzzleShop - <span id="year"></span></p>
    </footer>
    <div
      class="offcanvas offcanvas-end"
      tabindex="-1"
      id="offcanvasRight"
      aria-labelledby="offcanvasRightLabel"
    >
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasRightLabel">
          Il tuo carrello
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body" id="cart-body"></div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./scripts/year.js"></script>
    <script src="./scripts/details.js"></script>
    <script src="./scripts/cart.js"></script>
  </body>
</html>
